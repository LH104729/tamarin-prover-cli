[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tamarin-cli"
version = "0.1.0"
description = "Explore-mode terminal and Python client for Tamarin Prover"
requires-python = ">=3.9"
license = {text = "GPL-3.0-or-later"}
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]

[project.scripts]
tamarin-cli = "tamarin_cli.repl:main"
tamarin-mcp = "tamarin_cli.mcp_server:main"

[tool.setuptools]
packages = ["tamarin_cli"]
